# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: decisionpulse-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Set to your Vercel URL(s), comma-separated, e.g. https://decisionpulse.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"
