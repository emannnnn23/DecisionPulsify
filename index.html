<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Course Slot Confirmation Predictor</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%238b5cf6' rx='20'/><text x='50' y='65' font-size='50' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>DP</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK Compat version via CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #eef2ff;
            color: #1e1b4b;
        }

        /* Preloader styles */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #c7d2fe;
            border-top: 6px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Clean select dropdown styling */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3E%3Cpath stroke='%238b5cf6' stroke-linecap='round' stroke-linejoin='round' stroke-width='2.5' d='m6 8 4 4 4-4'/%3E%3C/svg%3E");
            background-position: right 1rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 3rem;
        }

        /* Custom Scrollbar for a fun feel */
        ::-webkit-scrollbar {
            width: 14px;
        }

        ::-webkit-scrollbar-track {
            background: #e0e7ff;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #a78bfa;
            border-radius: 10px;
            border: 4px solid #e0e7ff;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: #8b5cf6;
        }

        /* Shine effect for progress bar */
        @keyframes shine {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body class="p-4 md:p-8 antialiased selection:bg-violet-300 selection:text-violet-900">

    <!-- Preloader -->
    <div id="preloader" class="preloader">
        <div class="spinner"></div>
    </div>

    <div class="max-w-3xl mx-auto relative z-10">
        <!-- Header -->
        <header
            class="mb-10 mt-4 md:mt-8 text-center transform transition hover:scale-[1.03] duration-300 cursor-default">
            <h1
                class="text-4xl md:text-6xl font-black tracking-tight bg-gradient-to-r from-violet-600 via-fuchsia-500 to-orange-500 bg-clip-text text-transparent pb-2 drop-shadow-sm">
                DecisionPulse</h1>
            <p class="text-indigo-900/60 mt-2 text-lg font-bold">Course Acceptance Probability System 🚀</p>
        </header>

        <div
            class="bg-white border-4 border-indigo-50 rounded-3xl p-6 md:p-8 mb-8 shadow-xl shadow-indigo-200/50 transform transition duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-indigo-200/60">
            <!-- Course Type Selector -->
            <div>
                <label for="courseType" class="block text-lg font-extrabold text-indigo-900 mb-3">🎯 Select Your Target
                    Program</label>
                <select id="courseType" name="courseType"
                    class="w-full rounded-2xl border-4 border-indigo-100 bg-indigo-50/50 px-5 py-4 text-lg font-bold text-indigo-900 focus:border-violet-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-500/20 transition-all cursor-pointer hover:border-violet-300 hover:shadow-lg">
                    <option value="" disabled selected>✨ Choose a program to begin...</option>
                    <option value="TOURISM">✈️ Bachelor of Science in Tourism Management</option>
                    <option value="CS">💻 Bachelor of Science in Computer Science</option>
                    <option value="CRIMINOLOGY">🕵️ Bachelor of Science in Criminology</option>
                    <option value="EDUCATION">📚 Bachelor of Science in Education</option>
                    <option value="NURSING">🏥 Bachelor of Science in Nursing</option>
                </select>
            </div>
        </div>

        <!-- Prediction Form Container -->
        <div id="formContainer"
            class="bg-white border-4 border-indigo-50 rounded-3xl p-6 md:p-8 shadow-xl shadow-indigo-200/50 hidden transform transition-all duration-500 scale-95 opacity-0 origin-top">
            <form id="predictionForm" class="space-y-8" data-form-hidden="true">

                <!-- Section 1: Academic Data -->
                <div class="bg-indigo-50/50 p-6 md:p-8 rounded-3xl border-2 border-indigo-100/50 shadow-inner">
                    <div class="mb-6 flex items-center gap-3">
                        <span
                            class="bg-violet-200 text-violet-800 w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl shadow-sm transform -rotate-3">1</span>
                        <h2 class="text-2xl font-black text-indigo-900">Academic Background</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="input-group group">
                            <label for="gwa"
                                class="block text-base font-bold text-indigo-900 mb-2 group-hover:text-violet-600 transition-colors">General
                                Weighted Average</label>
                            <input type="number" id="gwa" name="gwa" step="0.01" min="70" max="100" required
                                placeholder="e.g. 85.5"
                                class="w-full rounded-2xl border-2 border-indigo-100 bg-white px-4 py-3 text-lg font-bold placeholder:text-indigo-300 focus:border-violet-500 focus:outline-none focus:ring-4 focus:ring-violet-500/20 transition-all hover:border-violet-300 hover:shadow-md">
                        </div>

                        <div class="input-group group">
                            <label for="shs_strand"
                                class="block text-base font-bold text-indigo-900 mb-2 group-hover:text-violet-600 transition-colors">SHS
                                Strand / Track</label>
                            <select id="shs_strand" name="shs_strand" required
                                class="w-full rounded-2xl border-2 border-indigo-100 bg-white px-4 py-3 text-lg font-bold focus:border-violet-500 focus:outline-none focus:ring-4 focus:ring-violet-500/20 transition-all cursor-pointer hover:border-violet-300 hover:shadow-md">
                                <option value="" disabled selected>Select strand...</option>
                                <option value="HUMSS">HUMSS</option>
                                <option value="STEM">STEM</option>
                                <option value="GAS">GAS</option>
                                <option value="ABM">ABM</option>
                                <option value="TVL">TVL</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div class="input-group group">
                            <label for="high_school_type"
                                class="block text-base font-bold text-indigo-900 mb-2 group-hover:text-violet-600 transition-colors">Type
                                of High School</label>
                            <select id="high_school_type" name="high_school_type" required
                                class="w-full rounded-2xl border-2 border-indigo-100 bg-white px-4 py-3 text-lg font-bold focus:border-violet-500 focus:outline-none focus:ring-4 focus:ring-violet-500/20 transition-all cursor-pointer hover:border-violet-300 hover:shadow-md">
                                <option value="" disabled selected>Select type...</option>
                                <option value="Public">Public</option>
                                <option value="Private">Private</option>
                                <option value="Science High School">Science High School</option>
                            </select>
                        </div>

                        <div class="input-group group">
                            <label for="with_honors"
                                class="block text-base font-bold text-indigo-900 mb-2 group-hover:text-violet-600 transition-colors">Honors
                                / Recognition</label>
                            <select id="with_honors" name="with_honors" required
                                class="w-full rounded-2xl border-2 border-indigo-100 bg-white px-4 py-3 text-lg font-bold focus:border-violet-500 focus:outline-none focus:ring-4 focus:ring-violet-500/20 transition-all cursor-pointer hover:border-violet-300 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes 🏆</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Questions Container -->
                <div id="dynamicQuestions"
                    class="bg-fuchsia-50/60 p-6 md:p-8 rounded-3xl border-2 border-fuchsia-100/50 shadow-inner space-y-6">
                    <!-- Questions will be dynamically inserted here -->
                </div>

                <!-- Universal Questions (Q11-Q20) -->
                <div class="bg-orange-50/60 p-6 md:p-8 rounded-3xl border-2 border-orange-100/50 shadow-inner">
                    <div class="mb-6 flex items-center gap-3">
                        <span
                            class="bg-orange-200 text-orange-800 w-10 h-10 rounded-2xl flex items-center justify-center font-black text-xl shadow-sm transform rotate-3">3</span>
                        <h2 class="text-2xl font-black text-orange-950">General Factors</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                        <!-- Input Groups -->
                        <div class="input-group group">
                            <label for="q11"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Did
                                you choose this course because it aligns with your interests?</label>
                            <select id="q11" name="q11" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q12"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Do
                                you feel confident in succeeding in this course?</label>
                            <select id="q12" name="q12" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q13"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Have
                                you researched what careers are available after this course?</label>
                            <select id="q13" name="q13" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q14"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Did
                                your parents/guardians support your decision to take this course?</label>
                            <select id="q14" name="q14" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q15"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Did
                                any relatives or friends influence your choice of course?</label>
                            <select id="q15" name="q15" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q16"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Do
                                you personally know someone currently studying this course?</label>
                            <select id="q16" name="q16" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q17"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Can
                                your family afford the tuition and other expenses for this course?</label>
                            <select id="q17" name="q17" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q18"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Are
                                there available scholarships or financial aid options for this course?</label>
                            <select id="q18" name="q18" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q19"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Is
                                the university near your home or place of residence?</label>
                            <select id="q19" name="q19" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="input-group group">
                            <label for="q20"
                                class="block text-base font-bold text-orange-950 mb-2 group-hover:text-orange-600 transition-colors">Did
                                you apply for other courses as well?</label>
                            <select id="q20" name="q20" required
                                class="w-full rounded-2xl border-2 border-orange-200 bg-white px-4 py-3 text-lg font-bold focus:border-orange-500 focus:outline-none focus:ring-4 focus:ring-orange-500/20 transition-all cursor-pointer hover:border-orange-400 hover:shadow-md">
                                <option value="" disabled selected>Select...</option>
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-6">
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-black text-xl py-5 px-6 rounded-3xl shadow-xl shadow-violet-500/40 transition-all transform hover:-translate-y-2 hover:shadow-2xl hover:shadow-violet-500/50 active:translate-y-1 active:scale-95 focus:outline-none focus:ring-4 focus:ring-violet-500/50 cursor-pointer">
                        ✨ Predict Probability ✨
                    </button>
                </div>
            </form>
        </div>

        <!-- Prediction Result Card -->
        <div id="resultCard"
            class="mt-8 bg-white border-4 border-indigo-50 p-8 rounded-3xl shadow-2xl shadow-indigo-200/50 hidden transform transition-all duration-700 scale-95 opacity-0">
            <div class="flex items-center justify-center mb-6">
                <span
                    class="px-5 py-2 bg-indigo-100 text-indigo-800 rounded-2xl text-sm font-black uppercase tracking-widest">Prediction
                    Result</span>
            </div>
            <div id="resultText" class="mb-8 text-center">
                <!-- Result will be inserted here -->
            </div>
            <div id="progressBar"
                class="w-full bg-slate-100 rounded-full h-5 shadow-inner overflow-hidden border-2 border-slate-200 p-0.5">
                <div id="progressFill"
                    class="h-full rounded-full transition-all duration-1500 ease-out relative overflow-hidden"
                    style="width: 0%">
                    <!-- Shine effect on progress bar -->
                    <div class="absolute top-0 left-0 w-full h-full bg-white/30"
                        style="background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shine 2s infinite;">
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Alert/Message Box -->
        <div id="messageBox"
            class="fixed bottom-6 right-6 z-50 px-6 py-4 rounded-3xl shadow-2xl border-4 border-rose-200 text-base font-black text-rose-900 bg-rose-50 hidden flex items-center gap-4 transform transition-all duration-300 translate-y-10 opacity-0"
            role="alert">
            <div class="bg-rose-200 p-3 rounded-2xl transform rotate-12">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16"
                    class="text-rose-600">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                    <path
                        d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z" />
                </svg>
            </div>
            <p id="messageText"></p>
        </div>

        <!-- Footer -->
        <footer class="mt-20 py-8 text-center text-sm font-black text-indigo-900/30 tracking-wide">
            <p>DEVELOPED WITH ❤️ BY REY DENZO</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // Hide preloader when page fully loads
        window.addEventListener('load', function () {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 400);
        });

        // Show form container when course is selected with a fun animation
        document.getElementById('courseType').addEventListener('change', function () {
            const formContainer = document.getElementById('formContainer');
            if (this.value) {
                formContainer.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating opacity/transform
                setTimeout(() => {
                    formContainer.classList.remove('scale-95', 'opacity-0');
                    formContainer.classList.add('scale-100', 'opacity-100');
                }, 50);
            } else {
                formContainer.classList.remove('scale-100', 'opacity-100');
                formContainer.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    formContainer.classList.add('hidden');
                }, 500);
            }
        });
    </script>
</body>

</html>
